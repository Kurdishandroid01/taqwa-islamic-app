<!DOCTYPE html>
<html data-theme="theme_1">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport"
        content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="/css/var.css"> <!-- المتغيرات -->
    <link rel="stylesheet" href="/css/main.css"> <!-- ملف الإستايل الأساسي -->
    <link rel="stylesheet" href="/css/footer.css"> <!-- ملف css الفوتر -->
    <link rel="stylesheet" href="/css/ramadanTime.css">
    <link rel="stylesheet" href="/css/more.css">
    <link rel="stylesheet" href="/css/animate.min.css"> <!-- مؤثرات الإنتقال -->
    <title>التقوى</title>
</head>

<body>

    <div id="more_header" class="animate__animated animate__fadeIn">

        <img src="/img/back.png" id="back">

        <p id="more_header_title">
           المتبقي على رمضان
        </p>

    </div>

    <div id="content" class="animate__animated animate__fadeIn">

        <img src="/img/loading.svg" alt="loading" id="loading">

        <!-- ================ ضع هنا محتوى الصفحة =============== -->

        <h2 id="title_ramadan">
            الوقت المتبقي لشهر رمضان الكريم
        </h2>

        <div id="isRamadan">
            🌙 نحن الآن في شهر رمضان 🌙
        </div>

        <ul id="NotRamadan">

            <li>
                <p class="number_ramadan" id="seconds_r">
                    
                </p>

                <p class="title_ramadan">
                    ثانية
                </p>
            </li>

            <li>
                <p class="number_ramadan" id="minutes_r">
                    
                </p>

                <p class="title_ramadan">
                    دقيقة
                </p>
            </li>

            <li>
                <p class="number_ramadan" id="hours_r">
                    
                </p>

                <p class="title_ramadan">
                    ساعة
                </p>
            </li>

            <li>
                <p class="number_ramadan" id="days_r">
                    
                </p>

                <p class="title_ramadan">
                    يوم
                </p>
            </li>

        </ul>

        <!-- ================ ضع هنا محتوى الصفحة =============== -->

    </div>


    <footer id="footer">
        <!-- الفوتر مربوط بالجافاسكربت -->
    </footer>

    <script src="/js/index.js" type="module"></script>
</body>

</html>
